<script>
/** Kanban y edición de pasos; reutiliza la instantánea local y los flujos de cierre existentes. */
  /** Representa las columnas y las tarjetas autorizadas; permite mover mediante selector o arrastre. */
  function renderBoard() {
    if(!state.data){$('#kanban-board').replaceChildren();$('#board-owners').replaceChildren();state.boardOwner='';return;}
    renderBoardOwners();
    const query=$('#board-search').value.toLowerCase(),mine=$('#board-mine').checked;
    const columns=UI_CONFIG.status;
    const rows=state.data.commitments.filter(c=>(!state.boardOwner||c.owner_id===state.boardOwner)&&(!mine||state.details[c.compromiso_id].isTask)&&(!$('#board-postponed').checked||matchesFollowup(state.details[c.compromiso_id],'postponed'))&&matchesFollowup(state.details[c.compromiso_id],$('#board-followup').value)&&(!query||`${c.titulo} ${c.owner_name} ${c.project_name}`.toLowerCase().includes(query)));
    $('#board-results').textContent=`${rows.length} de ${state.data.commitments.length} compromisos visibles`;
    $('#kanban-board').innerHTML=columns.map(status=>{
      const cards=rows.filter(c=>c.estado===status);
      return `<section class="kanban-column" data-column="${status}" aria-label="${statusName(status)}"><h2>${statusName(status)} <span class="badge">${cards.length}</span></h2><div class="kanban-cards">${cards.map(c=>{
        const detail=state.details[c.compromiso_id],items=c.checklist||[],done=items.filter(i=>i.done).length;
        const timing=detail.boardTiming||{};
        const canMove=detail.permissions.edit&&!state.boardBusy;
        const targets=UI_CONFIG.openStatus.concat(detail.permissions.close?[booleanValue(c.requiere_aprobacion)?'EN_APROBACION':'CERRADO']:[]);
        return `<article class="kanban-card" data-card="${escapeHtml(c.compromiso_id)}" draggable="${canMove}"><button type="button" class="text-button kanban-title" data-action="board-detail" data-id="${escapeHtml(c.compromiso_id)}">${escapeHtml(c.titulo)}</button><p class="task-sub">${escapeHtml(c.project_name)}</p><p>${escapeHtml(c.owner_name)} · ${dateLabel(c.fecha_objetivo)}</p><span class="pill ${criticalityClass(c.criticidad)}">${criticalityName(c.criticidad)}</span>${renderBoardTiming(timing)}${renderCardBaseline(detail.baseline)}${renderDependencyBadge(detail.dependencies)}<div class="kanban-progress"><progress max="100" value="${Number(c.porcentaje_avance)||0}" aria-label="Avance"></progress><span>${Number(c.porcentaje_avance)||0}%</span></div>${items.length?`<span class="muted">Checklist: ${done}/${items.length}</span>`:''}${canMove?`<label class="kanban-move">Mover a<select data-board-move="${escapeHtml(c.compromiso_id)}">${targets.map(s=>`<option value="${s}" ${s===status?'selected':''}>${statusName(s)}</option>`).join('')}</select></label>`:''}</article>`;
      }).join('')||'<p class="empty-state">Sin compromisos.</p>'}</div></section>`;
    }).join('');
  }

  /** Representa responsables y cantidades autorizadas; conserva la selección entre sincronizaciones. */
  function renderBoardOwners() {
    const people=new Map(state.data.people.map(p=>[p.usuario_id,p.nombre]));
    const counts=new Map();
    state.data.commitments.forEach(c=>{if(!people.has(c.owner_id))people.set(c.owner_id,c.owner_name||c.owner_id);counts.set(c.owner_id,(counts.get(c.owner_id)||0)+1);});
    if(state.boardOwner&&!people.has(state.boardOwner))state.boardOwner='';
    const options=[['','Todos',state.data.commitments.length],...Array.from(people).sort((a,b)=>a[1].localeCompare(b[1],'es')).map(([id,name])=>[id,name,counts.get(id)||0])];
    $('#board-owners').innerHTML=options.map(([id,name,count])=>`<button type="button" class="kanban-owner" data-board-owner="${escapeHtml(id)}" aria-pressed="${(state.boardOwner||'')===id}" title="${count} compromisos visibles antes de aplicar búsqueda y Solo mis tareas">${escapeHtml(name)} <span class="kanban-owner-count">${count}</span></button>`).join('');
  }

  /**
   * Representa antigüedad y tiempo en estado sin inventar datos históricos ausentes.
   * @param {Object} timing - Indicadores calculados por el servidor en America/Lima.
   * @returns {string} Indicadores accesibles y bandera de postergación.
   */
  function renderBoardTiming(timing) {
    const age=timing.ageDays==null?'Sin fecha de creación':`${timing.ageDays} ${timing.ageDays===1?'día':'días'} desde creación`;
    const status=timing.stateDays==null?'Estado: sin historial':`${timing.stateDays} ${timing.stateDays===1?'día':'días'} en este estado`;
    return `<div class="kanban-timing"><span title="Días calendario desde la creación, en Lima">${age}</span><span title="${timing.stateSince?'Desde '+escapeHtml(dateLabel(timing.stateSince)):'No hay un cambio registrado que permita fechar el estado actual'}">${status}</span></div>${timing.postponed?'<span class="kanban-postponed" title="La fecha objetivo se ha movido a una fecha posterior al menos una vez">⚑ Postergado</span>':''}`;
  }

  /**
   * Cambia solo estados abiertos; los destinos de cierre abren el flujo de evidencias.
   * @param {string} id - ID de compromiso.
   * @param {string} target - Estado de la columna destino.
   * @returns {Promise<void>} Mutación completada o formulario de cierre abierto.
   */
  async function moveBoardCard(id,target) {
    const detail=state.details[id];if(!detail||state.boardBusy)return;
    const c=detail.commitment;if(c.estado===target)return;
    if(!detail.permissions.edit){showToast('Este compromiso no se puede mover.');renderBoard();return;}
    if(['EN_APROBACION','CERRADO'].includes(target)) {
      const destination=booleanValue(c.requiere_aprobacion)?'EN_APROBACION':'CERRADO';
      if(!detail.permissions.close||target!==destination){showToast('El cierre debe seguir las reglas de evidencias y aprobación.');renderBoard();return;}
      openDetail(id);
      $('#detail-content [data-action="open-evidence"]').click();
      renderBoard();return;
    }
    if(!UI_CONFIG.openStatus.includes(target)){showToast('Usa Anular con motivo desde el detalle.');renderBoard();return;}
    state.boardBusy=true;state.mutations++;state.epoch++;renderBoard();
    try {applyMutation(await callServer('updateCommitment',{compromiso_id:id,expected_version:c._version,changes:{estado:target}}));showToast('Compromiso movido.');}
    catch(error){mutationError(error);}
    finally {state.boardBusy=false;state.mutations--;state.epoch++;renderBoard();if(state.syncRequested){state.syncRequested=false;synchronize();}}
  }

  /**
   * Construye un checklist editable únicamente cuando los permisos del detalle lo permiten.
   * @param {Object} detail - Detalle autorizado.
   * @returns {string} Formulario o lista de lectura.
   */
  function renderChecklist(detail) {
    const items=detail.commitment.checklist||[],editable=detail.permissions.edit;
    return `<section id="checklist-section" class="detail-section"><h3>Checklist <span class="muted">${items.filter(i=>i.done).length}/${items.length} completados</span></h3>${editable?`<form id="checklist-form" data-id="${escapeHtml(detail.commitment.compromiso_id)}" data-version="${escapeHtml(detail.commitment._version)}"><div id="checklist-items">${items.map(i=>checklistRow(i)).join('')}</div><div class="dialog-actions"><button type="button" class="button" data-action="checklist-add">＋ Añadir paso</button><button type="submit" class="button primary">Guardar checklist</button></div><p id="checklist-error" class="form-error" role="alert"></p><p class="muted">Hasta 40 pasos. El checklist no cambia automáticamente el avance ni sustituye las evidencias.</p></form>`:items.map(i=>`<p>${i.done?'✓':'○'} ${escapeHtml(i.title)}</p>`).join('')||'<p class="muted">Sin pasos registrados.</p>'}</section>`;
  }

  /**
   * Crea un paso con ID estable y campos escapados.
   * @param {Object} item - Paso de checklist.
   * @returns {string} Fila de formulario.
   */
  function checklistRow(item) {
    return `<div class="checklist-row" data-step="${escapeHtml(item.id)}"><input type="checkbox" aria-label="Paso completado" ${item.done?'checked':''}><input type="text" aria-label="Título del paso" maxlength="160" required value="${escapeHtml(item.title)}"><button type="button" class="icon-button" data-action="checklist-remove" aria-label="Eliminar paso">×</button></div>`;
  }

  /** Registra interacción del tablero y checklists sin llamadas de lectura adicionales. */
  function startBoard() {
    $('#board-followup').addEventListener('change',renderBoard);
    $('#board-postponed').addEventListener('change',renderBoard);
    $('#board-owners').addEventListener('click',event=>{
      const button=event.target.closest('[data-board-owner]');if(!button)return;
      state.boardOwner=button.dataset.boardOwner;renderBoard();
      Array.from($('#board-owners').querySelectorAll('button')).find(b=>b.dataset.boardOwner===state.boardOwner)?.focus();
    });
    $('#board-search').addEventListener('input',renderBoard);
    $('#board-mine').addEventListener('change',renderBoard);
    document.addEventListener('change',event=>{if(event.target.matches('[data-board-move]'))moveBoardCard(event.target.dataset.boardMove,event.target.value);});
    document.addEventListener('dragstart',event=>{const card=event.target.closest('[data-card]');if(!card||card.draggable!==true)return;state.draggedCard=card.dataset.card;event.dataTransfer.setData('text/plain',card.dataset.card);event.dataTransfer.effectAllowed='move';});
    document.addEventListener('dragover',event=>{if(state.draggedCard&&event.target.closest('[data-column]'))event.preventDefault();});
    document.addEventListener('drop',event=>{const column=event.target.closest('[data-column]');if(!column||!state.draggedCard)return;event.preventDefault();const id=state.draggedCard;state.draggedCard=null;moveBoardCard(id,column.dataset.column);});
    document.addEventListener('dragend',()=>{state.draggedCard=null;});
  }
</script>
